spring.application.name=know-commute
server.port=8020

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:know_commute}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Liquibase owns the schema; Hibernate must never alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# Instant maps to timestamptz, matching the TIMESTAMP WITH TIME ZONE columns Liquibase creates.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP_UTC
logging.level.org.hibernate.orm.incubating=WARN

# RFC 9457 "type" prefix. A URN by default: it identifies the problem without claiming a
# domain we do not own. Point it at a real docs URL once one exists.
readcast.problem-type-base=urn:readcast:problem:

# The container healthcheck reads this. Nothing else is exposed: the app sits behind a reverse
# proxy on a shared network, so an open metrics or env endpoint is reachable by every neighbour.
management.endpoints.web.exposure.include=health

readcast.pipeline.enabled=true
readcast.pipeline.poll-interval=5s
readcast.pipeline.batch-size=10
readcast.pipeline.concurrency=4
readcast.pipeline.max-attempts=3
# Kokoro on CPU can take minutes per article; the lease must outlast the slowest step
# or a second worker claims the row mid-synthesis and burns the work twice.
readcast.pipeline.lease=20m
# Backoff must outlast a synthesis, not race it. At 30s the retries for a timed-out article
# landed while the original was still being generated, piling CPU work onto a saturated box.
readcast.pipeline.initial-backoff=2m

readcast.extraction.connect-timeout=10s
readcast.extraction.read-timeout=20s
readcast.extraction.max-response-bytes=5242880
readcast.extraction.max-redirects=5
readcast.extraction.minimum-words=150
readcast.extraction.user-agent=Mozilla/5.0 (compatible; ReadCast/1.0; +https://github.com/TimilehinPromise/know-commute)

readcast.summarization.max-input-words=40000

# Chat and speech are both "openai"-flavoured but point at different hosts: an
# OpenAI-compatible gateway for summarization, a self-hosted Kokoro for narration.
# Each model type carries its own base-url and api-key, so they do not collide.
spring.ai.model.chat=openai
# The speech model is built by hand in SpeechModelConfig; autoconfiguration must back off
# or its bean coexists with ours and injection fails on two candidates.
spring.ai.model.audio.speech=none
# The OpenAI starter otherwise autoconfigures these too, and each demands its own credentials.
spring.ai.model.audio.transcription=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none

spring.ai.openai.chat.base-url=${SUMMARY_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.chat.api-key=${SUMMARY_API_KEY:not-configured}
spring.ai.openai.chat.options.model=${READCAST_SUMMARY_MODEL:nvidia/nemotron-3-ultra-550b-a55b:free}
spring.ai.openai.chat.options.max-tokens=4096

# Kept so summarization can move back to Anthropic with one property change:
#   spring.ai.model.chat=anthropic  +  ANTHROPIC_API_KEY
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:not-configured}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_SUMMARY_MODEL:claude-sonnet-5}
spring.ai.anthropic.chat.options.max-tokens=4096

readcast.tts.base-url=${KOKORO_BASE_URL:http://localhost:8880/v1}
readcast.tts.api-key=${KOKORO_API_KEY:not-required}
readcast.tts.model=kokoro
readcast.tts.voice=${READCAST_VOICE:af_bella}
readcast.tts.response-format=mp3
readcast.tts.speed=1.0
# Synthesis runs slower than realtime, so a long summary takes minutes. Spring AI's own
# timeout property cannot raise this: toOptions() drops it and the 60s per-request default
# overrides the client. Hence the hand-built model.
readcast.tts.timeout=${KOKORO_TIMEOUT:15m}
# Synthesis is CPU-bound, not memory-bound, and the speech host shares its cores with other
# work. The pipeline runs four workers for cheap steps like fetching; only this many may be
# synthesising at once. Raising it past the speech host's spare cores causes proxy timeouts,
# which become retries, which add load — the failure is a spiral, not a cliff.
readcast.tts.max-concurrent=${KOKORO_MAX_CONCURRENT:2}
readcast.tts.basic-auth-user=${KOKORO_USER:}
readcast.tts.basic-auth-password=${KOKORO_PASSWORD:}

readcast.audio.bucket=${R2_BUCKET:readcast-audio}
readcast.audio.endpoint=${R2_ENDPOINT:}
readcast.audio.access-key=${R2_ACCESS_KEY:}
readcast.audio.secret-key=${R2_SECRET_KEY:}
readcast.audio.region=${R2_REGION:auto}
readcast.audio.presign-ttl=15m
readcast.audio.retention=30d
