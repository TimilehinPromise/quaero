databaseChangeLog:
  - changeSet:
      id: 007-create-listener-profiles
      author: timmy
      changes:
        - createTable:
            tableName: listener_profiles
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_listener_profiles
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_listener_profiles_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: profile_text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: profile_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: listener_profiles
            columnNames: user_id
            constraintName: ux_listener_profiles_user
      rollback:
        - dropTable:
            tableName: listener_profiles

  - changeSet:
      id: 007-add-bookmark-lens
      author: timmy
      comment: >-
        All three null means a plain summary. The profile is a snapshot taken when the bookmark
        is created, so editing the profile never changes a bookmark already in the pipeline.
      changes:
        - addColumn:
            tableName: bookmarks
            columns:
              - column:
                  name: lens_profile
                  type: TEXT
              - column:
                  name: lens_profile_hash
                  type: VARCHAR(64)
              - column:
                  name: lens_brief
                  type: TEXT
      rollback:
        - dropColumn:
            tableName: bookmarks
            columns:
              - column:
                  name: lens_profile
              - column:
                  name: lens_profile_hash
              - column:
                  name: lens_brief
