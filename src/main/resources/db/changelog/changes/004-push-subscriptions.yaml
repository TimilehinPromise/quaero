databaseChangeLog:
  - changeSet:
      id: 004-create-push-subscriptions
      author: timmy
      changes:
        - createTable:
            tableName: push_subscriptions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_push_subscriptions
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_push_subscriptions_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: endpoint
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: p256dh
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: auth
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-push-subscriptions-unique-endpoint
      author: timmy
      changes:
        - sql:
            comment: >-
              Push endpoints are long URLs; index the digest for the same page-limit reason
              as bookmarks.url.
            sql: >-
              CREATE UNIQUE INDEX ux_push_subscriptions_endpoint
              ON push_subscriptions (user_id, md5(endpoint))
      rollback:
        - sql:
            sql: DROP INDEX ux_push_subscriptions_endpoint
