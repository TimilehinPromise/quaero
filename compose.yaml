# Local development dependencies. Not the deployment topology — that lands in stage 7.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: know_commute
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  kokoro:
    # The caption endpoint is a /dev API; pin the release whose response contract we consume.
    # CPU image: synthesis takes minutes per article, which is why the pipeline lease is 45m.
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.1
    ports:
      - "8880:8880"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
