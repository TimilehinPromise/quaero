name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/timilehinpromise/quaero

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers needs a real Docker daemon and a real Postgres; the runner provides both.
      - name: Verify
        run: ./mvnw --batch-mode verify

      - uses: docker/setup-buildx-action@v3
        if: github.ref == 'refs/heads/main'

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is built from the jar the verify step just produced, so nothing is compiled
      # twice and the pushed artifact is the one the tests ran against.
      - name: Build and push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Links the GHCR package to this repository, which is what surfaces its visibility
          # setting under the repo rather than leaving it an orphaned user-level package.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Coolify's own auto-deploy would fire on the push event, before this image exists.
      # Triggering it here instead keeps the deploy behind a green build.
      - name: Trigger Coolify deploy
        if: github.ref == 'refs/heads/main'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
        run: |
          : "${COOLIFY_URL:?secret is not set - the image was pushed but nothing was deployed}"
          : "${COOLIFY_TOKEN:?secret is not set - the image was pushed but nothing was deployed}"
          : "${COOLIFY_UUID:?secret is not set - the image was pushed but nothing was deployed}"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_UUID&force=false"
