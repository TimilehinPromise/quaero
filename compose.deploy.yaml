services:
  zeteo:
    image: ghcr.io/timilehinpromise/quaero:${READCAST_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-know_commute}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SUMMARY_BASE_URL: ${SUMMARY_BASE_URL:-https://openrouter.ai/api/v1}
      SUMMARY_API_KEY: ${SUMMARY_API_KEY}
      READCAST_SUMMARY_MODEL: ${READCAST_SUMMARY_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
      SUMMARY_TIMEOUT: ${SUMMARY_TIMEOUT:-5m}
      SUMMARY_MAX_SOURCE_FRACTION: ${SUMMARY_MAX_SOURCE_FRACTION:-0.33}
      SUMMARY_MIN_WORDS: ${SUMMARY_MIN_WORDS:-150}

      KOKORO_BASE_URL: ${KOKORO_BASE_URL:-http://kokoro:8880/v1}
      KOKORO_TIMEOUT: ${KOKORO_TIMEOUT:-3m}
      KOKORO_CHUNK_CHARS: ${KOKORO_CHUNK_CHARS:-1200}
      KOKORO_MAX_CONCURRENT: ${KOKORO_MAX_CONCURRENT:-2}
      READCAST_VOICE: ${READCAST_VOICE:-af_bella}

      # The frontend's origin, e.g. https://app.example.com. Comma-separated for several.
      READCAST_ALLOWED_ORIGINS: ${READCAST_ALLOWED_ORIGINS:-}

      # Hosted reader fallback for JS-rendered pages (the EMPTY route). Off unless opted in;
      # with READER_ENABLED=true and no key the app refuses to start, so a misconfiguration
      # fails at deploy time rather than on the first JS-only bookmark.
      READER_ENABLED: ${READER_ENABLED:-false}
      JINA_API_KEY: ${JINA_API_KEY}

      # Builder-only figure traces. Set the directory to /data/figure-debug on the dev deployment
      # and enable the viewer there; a token turns on browser Basic authentication.
      READCAST_FIGURE_DEBUG_DIR: ${READCAST_FIGURE_DEBUG_DIR:-}
      READCAST_FIGURE_DEBUG_VIEWER_ENABLED: ${READCAST_FIGURE_DEBUG_VIEWER_ENABLED:-false}
      READCAST_FIGURE_DEBUG_VIEWER_TOKEN: ${READCAST_FIGURE_DEBUG_VIEWER_TOKEN:-}

      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET:-readcast-audio}
      R2_REGION: ${R2_REGION:-auto}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8020/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    volumes:
      - readcast-figure-debug:/data/figure-debug
    # A stable name for the Nginx upstream. Coolify suffixes container names with the resource
    # UUID, so the generated name changes and cannot be written into a proxy config.
    networks:
      coolify:
        aliases:
          - zeteo

volumes:
  readcast-figure-debug:

networks:
  coolify:
    external: true
